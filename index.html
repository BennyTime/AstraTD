<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astra TD</title>
    <style>
      :root {
        --bg: #050913;
        --panel: rgba(8, 12, 24, 0.75);
        --text: #d8f1ff;
        --accent: #46d4ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at 15% 15%, #0e1831 0%, var(--bg) 55%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, sans-serif;
      }

      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }

      /* HUD and overlay styles are injected by JS modules */
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud"></div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.162.0/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
