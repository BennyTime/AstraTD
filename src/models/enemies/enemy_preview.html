<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Standard Enemy – Astra TD Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #020408; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #d8f1ff; }
    canvas { display: block; }
    #label {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      color: #ff2060; font-size: 11px; letter-spacing: 0.25em; font-weight: 700;
      background: rgba(6,10,22,0.7); padding: 6px 16px; border-radius: 6px;
      border: 1px solid rgba(255,32,96,0.3);
    }
    #ctrl {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px;
      background: rgba(6,10,22,0.85); border: 1px solid rgba(255,32,96,0.3);
      border-radius: 10px; padding: 10px 18px; backdrop-filter: blur(6px);
    }
    button {
      background: rgba(255,32,96,0.1); color: #d8f1ff; border: 1px solid rgba(255,32,96,0.4);
      border-radius: 6px; padding: 7px 18px; font-size: 12px; letter-spacing: 0.1em; cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: rgba(255,32,96,0.22); }
    button.blue { border-color: rgba(70,212,255,0.4); }
    button.blue:hover { background: rgba(70,212,255,0.15); }
  </style>
</head>
<body>
  <div id="label">STANDARD ENEMY MODEL PREVIEW</div>
  <div id="ctrl">
    <button id="btn-walk" class="blue">WALK</button>
    <button id="btn-death">DEATH</button>
    <button id="btn-explode">EXPLODE</button>
    <button id="btn-reset" class="blue">RESET</button>
  </div>

  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.162.0/build/three.module.js"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { createStandardEnemy } from './StandardEnemy.js';
    import { createStarField }     from '../misc/StarField.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020408);

    const cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 300);
    cam.position.set(0, 2.2, 5);
    cam.lookAt(0, 1, 0);

    scene.add(new THREE.AmbientLight(0x1a2a4a, 0.7));
    const key = new THREE.DirectionalLight(0xd0e8ff, 1.3);
    key.position.set(6, 10, 5); key.castShadow = true;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x8020c0, 0.3);
    fill.position.set(-5, 4, -8);
    scene.add(fill);

    // Floor
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x0c1528, roughness: 0.8 }));
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const stars = createStarField();
    scene.add(stars.mesh);

    let enemy = createStandardEnemy();
    enemy.mesh.position.y = 0.186;
    enemy.mesh.userData._joyBaseY = 0.186;
    scene.add(enemy.mesh);

    function respawn() {
      scene.remove(enemy.mesh);
      enemy = createStandardEnemy();
      enemy.mesh.position.y = 0.186;
      enemy.mesh.userData._joyBaseY = 0.186;
      scene.add(enemy.mesh);
    }

    window.addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight);
      cam.aspect = innerWidth / innerHeight;
      cam.updateProjectionMatrix();
    });

    document.getElementById('btn-walk').addEventListener('click', () => { respawn(); enemy.setWalk(); });
    document.getElementById('btn-death').addEventListener('click', () => enemy.triggerDeath(() => {}));
    document.getElementById('btn-explode').addEventListener('click', () => enemy.triggerExplode(() => {}));
    document.getElementById('btn-reset').addEventListener('click', () => respawn());

    let angle = 0;
    const clock = new THREE.Clock();
    (function loop() {
      requestAnimationFrame(loop);
      const dt = clock.getDelta();
      stars.update(dt);
      enemy.update(dt);
      angle += dt * 0.25;
      cam.position.set(Math.sin(angle) * 5, 2.2, Math.cos(angle) * 5);
      cam.lookAt(0, 1, 0);
      renderer.render(scene, cam);
    })();
  </script>
</body>
</html>
