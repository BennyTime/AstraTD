<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Floating Crystals – Astra TD Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #020408; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #d8f1ff; }
    canvas { display: block; }
    #label {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      color: #00ffcc; font-size: 11px; letter-spacing: 0.25em; font-weight: 700;
      background: rgba(6,10,22,0.7); padding: 6px 16px; border-radius: 6px;
      border: 1px solid rgba(0,255,204,0.25);
    }
  </style>
</head>
<body>
  <div id="label">FLOATING CRYSTALS PREVIEW</div>

  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.162.0/build/three.module.js"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { createFloatingCrystal, createCrystalCluster } from './FloatingCrystal.js';
    import { createStarField } from './StarField.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020408);

    const cam = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 400);
    cam.position.set(0, 8, 18);
    cam.lookAt(0, 2, 0);

    scene.add(new THREE.AmbientLight(0x1a2a4a, 0.5));
    const sunLight = new THREE.DirectionalLight(0xd0e8ff, 0.8);
    sunLight.position.set(8, 12, 6);
    scene.add(sunLight);

    const stars = createStarField();
    scene.add(stars.mesh);

    const updateFns = [];

    // Individual orbiting crystals
    const defs = [
      { color: 0x44aaff, scale: 1.1, orbitR: 5, orbitY: 2, phase: 0 },
      { color: 0x8844ff, scale: 0.9, orbitR: 5, orbitY: 3, phase: 1.5 },
      { color: 0x00ffcc, scale: 0.8, orbitR: 5, orbitY: 1.5, phase: 3.0 },
      { color: 0xff4488, scale: 0.7, orbitR: 5, orbitY: 2.5, phase: 4.5 },
      { color: 0xffcc00, scale: 0.6, orbitR: 5, orbitY: 3.5, phase: 6.0 },
    ];
    defs.forEach(d => {
      const c = createFloatingCrystal(d);
      scene.add(c.mesh);
      updateFns.push(c.update);
    });

    // Cluster at center
    const cluster = createCrystalCluster({ orbitY: 2 });
    scene.add(cluster.mesh);
    updateFns.push(cluster.update);

    window.addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight);
      cam.aspect = innerWidth / innerHeight;
      cam.updateProjectionMatrix();
    });

    let angle = 0;
    const clock = new THREE.Clock();
    (function loop() {
      requestAnimationFrame(loop);
      const dt = clock.getDelta();
      stars.update(dt);
      updateFns.forEach(fn => fn(dt));
      angle += dt * 0.2;
      cam.position.set(Math.sin(angle) * 18, 8, Math.cos(angle) * 18);
      cam.lookAt(0, 2, 0);
      renderer.render(scene, cam);
    })();
  </script>
</body>
</html>
