<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Laser Turret – Astra TD Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #020408; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #d8f1ff; }
    canvas { display: block; }
    #label {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      color: #46d4ff; font-size: 11px; letter-spacing: 0.25em; font-weight: 700;
      background: rgba(6,10,22,0.7); padding: 6px 16px; border-radius: 6px;
      border: 1px solid rgba(70,212,255,0.25);
    }
    #ctrl {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px;
      background: rgba(6,10,22,0.85); border: 1px solid rgba(70,212,255,0.3);
      border-radius: 10px; padding: 10px 18px; backdrop-filter: blur(6px);
    }
    button {
      background: rgba(70,212,255,0.12); color: #d8f1ff; border: 1px solid rgba(70,212,255,0.4);
      border-radius: 6px; padding: 7px 18px; font-size: 12px; letter-spacing: 0.1em; cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: rgba(70,212,255,0.25); }
  </style>
</head>
<body>
  <div id="label">LASER TURRET MODEL PREVIEW</div>
  <div id="ctrl">
    <button id="btn-shoot">FIRE</button>
    <button id="btn-spawn">RE-SPAWN</button>
    <button id="btn-track">TRACK DUMMY</button>
    <button id="btn-orbit">TOGGLE ORBIT</button>
  </div>

  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.162.0/build/three.module.js"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { createLaserTurret } from './LaserTurret.js';
    import { createStarField }   from '../misc/StarField.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020408);

    const cam = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 300);
    cam.position.set(0, 3, 6);
    cam.lookAt(0, 1, 0);

    scene.add(new THREE.AmbientLight(0x1a2a4a, 0.7));
    const key = new THREE.DirectionalLight(0xd0e8ff, 1.2);
    key.position.set(8, 12, 6); key.castShadow = true;
    scene.add(key);

    // Floor
    const floor = new THREE.Mesh(
      new THREE.CylinderGeometry(3, 3, 0.1, 16),
      new THREE.MeshStandardMaterial({ color: 0x0e1a30, roughness: 0.7, metalness: 0.6 })
    );
    floor.receiveShadow = true;
    scene.add(floor);

    const stars = createStarField();
    scene.add(stars.mesh);

    let turret = createLaserTurret();
    scene.add(turret.mesh);
    turret.mesh.position.y = 0.05;

    // Dummy target sphere
    const dummy = new THREE.Mesh(
      new THREE.SphereGeometry(0.2, 12, 8),
      new THREE.MeshStandardMaterial({ color: 0xff2060, emissive: new THREE.Color(0xff2060), emissiveIntensity: 1.2 })
    );
    dummy.position.set(3, 1.5, 0);
    scene.add(dummy);
    let dummyAngle = 0;
    let trackEnabled = false;

    window.addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight);
      cam.aspect = innerWidth / innerHeight;
      cam.updateProjectionMatrix();
    });

    let orbitActive = true;
    let orbitAngle = 0;
    document.getElementById('btn-shoot').addEventListener('click', () => turret.triggerShoot(dummy.position.clone()));
    document.getElementById('btn-spawn').addEventListener('click', () => {
      scene.remove(turret.mesh);
      turret = createLaserTurret();
      turret.mesh.position.y = 0.05;
      scene.add(turret.mesh);
    });
    document.getElementById('btn-track').addEventListener('click', () => { trackEnabled = !trackEnabled; });
    document.getElementById('btn-orbit').addEventListener('click', () => { orbitActive = !orbitActive; });

    const clock = new THREE.Clock();
    (function loop() {
      requestAnimationFrame(loop);
      const dt = clock.getDelta();
      stars.update(dt);
      turret.update(dt);

      // Dummy orbit
      dummyAngle += dt * 0.9;
      dummy.position.set(Math.sin(dummyAngle) * 3.5, 1.5, Math.cos(dummyAngle) * 3.5);

      if (trackEnabled) turret.trackTarget(dummy.position);

      if (orbitActive) {
        orbitAngle += dt * 0.22;
        cam.position.set(Math.sin(orbitAngle) * 6, 3, Math.cos(orbitAngle) * 6);
        cam.lookAt(0, 1, 0);
      }
      renderer.render(scene, cam);
    })();
  </script>
</body>
</html>
